# Create a service account for jenkins in the webapps namespace
apiVersion: v1 
kind: ServiceAccount 
metadata: 
  name: jenkins   
  namespace: webapps 

# Create role for jenkins to manage resources in the webapps namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-role
  namespace: webapps
rules:
- apiGroups:
  - ""
  resources:
  - services
  - pods
  - configmaps
  - secrets
  - endpoints
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - daemonsets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

  # Create a role binding to bind the jenkins service account to the app-roleapiVersion: rbac.authorization.k8s.io/v1
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-rolebinding
  namespace: webapps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-role
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: webapps

#Create a secret for jenkins to use the service
apiVersion: v1 
kind: Secret 
type: kubernetes.io/service-account-token
metadata: 
  name: jenkins-secret
  annotations: 
    kubernetes.io/service-account.name: jenkins